# Cardio 后端反代 —— 加入到 abc-ai.cn 的 server 块内（与 FastToken 共存）
# 前端（card-io.pages.dev）通过 https://www.abc-ai.cn/cardio 调用
location /cardio/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE / 长连接支持
    proxy_set_header Connection '';
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    # CORS（前端来源与后端不同源时需要）
    add_header Access-Control-Allow-Origin 'https://card-io.pages.dev' always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Content-Type, X-Cardio-Key' always;
    if ($request_method = 'OPTIONS') {
        return 204;
    }
}
